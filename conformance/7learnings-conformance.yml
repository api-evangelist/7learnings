summary: >-
  7Learnings publishes two audited security certifications and, in its public data-integration
  specification, commits to a set of ISO data-representation standards for the fields it
  consumes. Its only machine-readable protocol surface (the MCP endpoint) conforms to the
  OAuth 2.0 discovery RFCs. There is no OpenAPI, so no spec-derived conformance is asserted.


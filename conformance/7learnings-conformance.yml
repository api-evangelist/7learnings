domain_standards:
  note: >-
    Predictive pricing / retail optimization has no single dominant wire standard, and
    7Learnings declares none (no GS1, no EDI/EDIFACT, no OpenRTB). What its published data
    contract DOES declare are the identifier and representation standards below - each is
    named explicitly in the Initial Data Request specification or the changelog, with the
    exact field or entry cited. Nothing was inferred.
  standards:
  - id: iso-3166
    conforms: true
    evidence: https://app-static-7l.storage.googleapis.com/latest/7Learnings_initial_data_request.pdf
    detail: >-
      Section 3.1 Channels - the `market` and `upload_market` columns are specified as
      "Country where the product was sold using ISO 3166 format (e.g. DE for Germany)".
  - id: iso-4217
    conforms: true
    evidence: https://app-static-7l.storage.googleapis.com/latest/7Learnings_initial_data_request.pdf
    detail: >-
      Section 3.1 Channels - `channel_currency` and `upload_currency` are specified as
      "Three letter code for local channel specific currency according to ISO 4217".
  - id: iso-8601
    conforms: true
    evidence: https://app-static-7l.storage.googleapis.com/latest/7Learnings_initial_data_request.pdf
    detail: >-
      Section 3.3 Transactions - `time` is specified as "an ISO 8601 UTC timestamp
      (e.g. 2024-02-06 22:54:51+00:00)".
  - id: rfc4180
    conforms: true
    evidence: https://7learnings.com/changelog/
    detail: >-
      Changelog 2026-08-11, "Major CSV Engine Migration": output format changed to RFC 4180
      compliant quoting, UTC timestamps and lowercase booleans. CSV is one of the two file
      formats (with Parquet) used across every file-based input and output transport.
  - id: apache-parquet
    conforms: true
    evidence: https://app-static-7l.storage.googleapis.com/latest/7Learnings_initial_data_request.pdf
    detail: >-
      Tables 1 and 16 - Parquet is an accepted format on every object-store and file transport
      (GCS, S3, Azure Blob, SFTP, FTPS, HTTPS) for both input and output.

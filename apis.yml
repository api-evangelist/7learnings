aid: 7learnings
name: 7Learnings
description: '7Learnings GmbH is a Berlin- and New York-based retail AI company, founded in 2019 by Felix Hoffmann, Eiko van Hettinga and Martin Nowak, whose platform applies predictive pricing and demand forecasting to B2C retail. Machine-learning models forecast the sales, revenue and profit impact of every candidate price, and the platform pushes optimized price, promotion, performance-marketing and ordering decisions back into the retailer''s commerce stack. It ships as single-tenant SaaS on Google Cloud with a published data-integration contract rather than a public REST API: input arrives over BigQuery, Snowflake, Fabric, GCS, S3, Azure Blob, SFTP/FTPS/HTTPS or vendor connectors, and output is written back to commercetools, Tradebyte, Plentymarkets, Shopify, Scayle or Salesforce Commerce Cloud. It raised a EUR 10M+ Series B led by Acton Capital in May 2025 and is SOC 2 Type II and ISO/IEC 27001:2022 certified.'
